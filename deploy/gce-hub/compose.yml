# Sugent GCE 常驻中枢 (gce-hub) Docker Compose 编排
# 目标机器：airtoken-micro (e2-medium 2 vCPU / 4 GB，与远程开发及 airtoken 共存)
# 安全边界：宿主机仅监听 127.0.0.1:3600，绝不暴露公网端口；自动更新严格限定 label-enable，绝不触碰同机其他容器。

services:
  sugent-hub:
    image: ${SUGENT_IMAGE:-ghcr.io/ldc861117/sugent:latest}
    container_name: sugent-gce-hub
    restart: always
    stop_grace_period: 15s
    mem_limit: 1536m
    memswap_limit: 2048m
    extra_hosts:
      - "airtoken.metamirror.club:host-gateway"
      - "host.docker.internal:host-gateway"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "127.0.0.1:3600:3600"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AMB_DATA_DIR: /data
      # 容器内监听 0.0.0.0 以便 Docker 桥接转发宿主机 127.0.0.1:3600；宿主机侧已严格锁定环回地址
      AMB_UI_HOST: 0.0.0.0
      AMB_UI_PORT: "3600"
      SUGENT_NODE_ID: ${SUGENT_NODE_ID:-gce-hub}
      SUGENT_STEWARD_HUB_NODE: ${SUGENT_STEWARD_HUB_NODE:-gce-hub}
      SUGENT_WEIXIN_OWNER_NODE: ${SUGENT_WEIXIN_OWNER_NODE:-gce-hub}
    volumes:
      - sugent-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(3600,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sugent-updater:
    image: ${WATCHTOWER_IMAGE:-containrrr/watchtower:latest}
    container_name: sugent-image-updater
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 128m
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 严格仅监控带 watchtower.enable=true 标签的容器，物理隔离同机 airtoken 等服务
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${SUGENT_AUTO_UPDATE_INTERVAL_SEC:-300}
      WATCHTOWER_ROLLING_RESTART: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  sugent-data:
    name: sugent-data
